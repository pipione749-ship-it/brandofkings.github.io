  <style>
    :root {
      --ink: #112b3c;
      --mist: rgba(248, 252, 251, 0.84);
      --line: rgba(255, 255, 255, 0.72);
      --deep-teal: #0a5361;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    .app-wrapper {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
    }

    .ambient-field,
    .ambient-orb,
    .ambient-ribbon {
      position: absolute;
      pointer-events: none;
    }

    .ambient-field {
      z-index: -3;
      inset: 0;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 252, 224, 0.9) 0, rgba(255, 252, 224, 0) 32%),
        radial-gradient(circle at 82% 84%, rgba(255, 226, 153, 0.72) 0, rgba(255, 226, 153, 0) 35%),
        linear-gradient(135deg, #fffdf2 0%, #f8efd2 45%, #ead9a4 100%);
    }

    .ambient-orb {
      z-index: -2;
      border-radius: 999px;
      filter: blur(14px);
      opacity: 0.72;
      will-change: transform;
    }

    .orb-one {
      width: min(52vw, 680px);
      aspect-ratio: 1;
      top: -18%;
      right: -11%;
      background: radial-gradient(circle at 32% 30%, rgba(255, 249, 210, 0.9), rgba(255, 249, 210, 0.04) 68%);
      animation: drift-one 19s ease-in-out infinite alternate;
    }

    .orb-two {
      width: min(45vw, 570px);
      aspect-ratio: 1;
      bottom: -23%;
      left: -13%;
      background: radial-gradient(circle at 55% 45%, rgba(255, 214, 118, 0.72), rgba(255, 214, 118, 0.03) 70%);
      animation: drift-two 24s ease-in-out infinite alternate;
    }

    .orb-three {
      width: min(28vw, 390px);
      aspect-ratio: 1;
      top: 38%;
      left: 42%;
      background: radial-gradient(circle, rgba(255, 248, 211, 0.42), rgba(255, 248, 211, 0) 68%);
      animation: breathe 13s ease-in-out infinite alternate;
    }

    .ambient-ribbon {
      z-index: -1;
      width: 130%;
      height: 230px;
      left: -16%;
      top: 44%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 72px rgba(255, 255, 255, 0.28);
      transform: rotate(-10deg);
      animation: glide 20s ease-in-out infinite alternate;
    }

    .page-grid {
      background-image:
        linear-gradient(rgba(20, 93, 105, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 93, 105, 0.045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .glass-panel {
      background: var(--mist);
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(13, 77, 89, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .soft-reveal {
      animation: reveal 800ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .motion-control {
      transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .motion-control:hover { transform: translateY(-2px); }
    .motion-control:focus-visible {
      outline: 3px solid #0a5361;
      outline-offset: 3px;
    }

    .is-static .ambient-orb,
    .is-static .ambient-ribbon {
      animation-play-state: paused;
    }

    .is-static .orb-one { transform: translate3d(-4%, 3%, 0) scale(0.96); }
    .is-static .orb-two { transform: translate3d(5%, -4%, 0) scale(0.98); }
    .is-static .orb-three { transform: scale(0.94); }

    .toggle-play,
    .status-static { display: none; }

    .is-static .toggle-pause,
    .is-static .status-animated { display: none; }

    .is-static .toggle-play,
    .is-static .status-static { display: inline; }

    @keyframes drift-one {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-12%, 13%, 0) scale(1.12); }
    }

    @keyframes drift-two {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(18%, -11%, 0) scale(1.13); }
    }

    @keyframes breathe {
      from { transform: translate3d(-5%, -8%, 0) scale(0.86); opacity: 0.4; }
      to { transform: translate3d(10%, 8%, 0) scale(1.18); opacity: 0.7; }
    }

    @keyframes glide {
      from { transform: translate3d(-4%, -2%, 0) rotate(-10deg) scaleX(0.96); }
      to { transform: translate3d(9%, 8%, 0) rotate(-5deg) scaleX(1.08); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .orb-one { width: 86vw; right: -34%; top: -10%; }
      .orb-two { width: 86vw; left: -40%; bottom: -14%; }
      .orb-three { width: 58vw; left: 22%; }
      .ambient-ribbon { top: 55%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .ambient-orb,
      .ambient-ribbon {
        animation: none !important;
      }

      .orb-one { transform: translate3d(-4%, 3%, 0) scale(0.96); }
      .orb-two { transform: translate3d(5%, -4%, 0) scale(0.98); }
      .orb-three { transform: scale(0.94); }
    }

  <script>
  document.addEventListener('DOMContentLoaded',async()=>{const app=document.getElementById('app'),form=document.getElementById('publish-form'),grid=document.getElementById('product-grid'),cartCount=document.getElementById('cart-count');let products=[{name:'Vestido Alba',price:1299,description:'Corte fluido y acabado satinado.',category:'Ropa',image_url:'https://images.pexels.com/photos/17293344/pexels-photo-17293344.jpeg'},{name:'Textura Dorada',price:649,description:'Detalle elegante para elevar tu look.',category:'Accesorios',image_url:'https://images.pexels.com/photos/28716778/pexels-photo-28716778.jpeg'}],cart=0,filter='Todas';const render=()=>{const q=document.getElementById('search').value.toLowerCase();grid.innerHTML=products.filter(p=>(filter==='Todas'||p.category===filter)&&p.name.toLowerCase().includes(q)).map((p,i)=>`<article class="canva-card overflow-hidden rounded-3xl"><img class="canva-image h-64 w-full object-cover" src="${p.image_url||'https://images.pexels.com/photos/6021542/pexels-photo-6021542.jpeg'}" alt="${p.name}"><div class="p-5"><span class="text-xs uppercase tracking-widest opacity-70">${p.category}</span><h3 class="mt-2 font-semibold">${p.name}</h3><p class="mt-2 text-sm opacity-75">${p.description}</p><div class="mt-5 flex items-center justify-between"><strong>$${Number(p.price).toLocaleString('es-MX')}</strong><button class="add-cart canva-button rounded-full px-4 py-2 font-semibold" data-i="${i}" type="button">Añadir</button></div></div></article>`).join('')||'<p class="opacity-70">No encontramos prendas.</p>';document.querySelectorAll('.add-cart').forEach(b=>b.onclick=()=>{cart++;cartCount.textContent=cart});};document.getElementById('search').oninput=render;document.querySelectorAll('.category-button').forEach(b=>b.onclick=()=>{filter=b.dataset.category;render()});document.getElementById('publish-open').onclick=()=>form.classList.remove('hidden');document.getElementById('publish-cancel').onclick=()=>form.classList.add('hidden');form.onsubmit=async e=>{e.preventDefault();const p={name:document.getElementById('product-name').value,price:Number(document.getElementById('product-price').value),description:document.getElementById('product-description').value,category:document.getElementById('product-category').value,image_url:document.getElementById('product-image').value||'https://images.pexels.com/photos/6021542/pexels-photo-6021542.jpeg',created_at:new Date().toISOString()};products.push(p);render();form.reset();form.classList.add('hidden');document.getElementById('form-message').textContent='Prenda publicada.';if(window.dataSdk)await window.dataSdk.create(p)};const mb=document.getElementById('motion-button'),rm=matchMedia('(prefers-reduced-motion: reduce)');const stat=x=>{app.classList.toggle('is-static',x);mb.setAttribute('aria-pressed',x)};stat(rm.matches);mb.onclick=()=>stat(!app.classList.contains('is-static'));render();lucide.createIcons()});</script>
